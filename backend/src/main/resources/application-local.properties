# Docker-free student profile: embedded file database persists under backend/data/.
spring.datasource.url=jdbc:h2:file:./data/roadwatch;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
roadwatch.upload-dir=./uploads
roadwatch.ml-url=http://localhost:8001
roadwatch.admin-api-key=${ADMIN_API_KEY:change-this-admin-key}
