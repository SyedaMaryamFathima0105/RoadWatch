spring.application.name=roadwatch
server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:roadwatch}
spring.datasource.username=${POSTGRES_USER:roadwatch}
spring.datasource.password=${POSTGRES_PASSWORD:roadwatch}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
roadwatch.upload-dir=${UPLOAD_DIR:./uploads}
roadwatch.ml-url=${ML_SERVICE_URL:http://localhost:8001}
roadwatch.duplicate-radius-meters=${DUPLICATE_RADIUS_METERS:30}
roadwatch.admin-api-key=${ADMIN_API_KEY:change-this-admin-key}
springdoc.swagger-ui.path=/swagger-ui.html
