services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadwatch}
      POSTGRES_USER: ${POSTGRES_USER:-roadwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadwatch} -d ${POSTGRES_DB:-roadwatch}"]
      interval: 5s
      timeout: 3s
      retries: 10
  ml-service:
    build: ./ml-service
    environment:
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.35}
    ports: ["8001:8001"]
    volumes: ["./ml-service/models:/app/models"]
  backend:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
      ml-service: {condition: service_started}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-roadwatch}
      POSTGRES_USER: ${POSTGRES_USER:-roadwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      ML_SERVICE_URL: http://ml-service:8001
      UPLOAD_DIR: /app/uploads
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-this-admin-key}
    ports: ["8080:8080"]
    volumes: ["uploads:/app/uploads"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres_data:
  uploads:
